<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mateo Silva Games</title>
<meta name="description" content="Mateo Silva Games: indie mobile games. Mergeheim: Tower Defense.">
<link rel="icon" href="mergeheim-icon.png">
<style>
  :root { --bg: #FAF7FF; --card: #FFFFFF; --text: #1F1530; --muted: #5E5175; --accent: #6A3FD0; --line: #E6DDF5; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #140C22; --card: #21153A; --text: #F2EAFF; --muted: #B9A9DD; --accent: #B79BFF; --line: #34245A; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.55; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 22px 64px; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 36px; }
  .game { display: flex; gap: 20px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
  .game img { width: 112px; height: 112px; border-radius: 24px; flex: none; }
  .game h2 { margin: 0 0 6px; font-size: 1.35rem; }
  .game p { margin: 0 0 10px; color: var(--muted); }
  a { color: var(--accent); }
  footer { margin-top: 40px; color: var(--muted); font-size: .92rem; display: flex; gap: 18px; flex-wrap: wrap; }
  @media (max-width: 520px) { .game { flex-direction: column; text-align: center; } }
</style>
</head>
<body>
<main>
  <h1>Mateo Silva Games</h1>
  <p class="sub">Indie mobile games made in Argentina.</p>
  <section class="game">
    <img src="mergeheim-icon.png" alt="Mergeheim: Tower Defense icon">
    <div>
      <h2>Mergeheim: Tower Defense</h2>
      <p>Summon heroes, merge them into stronger rarities and evolve champions to hold back the Rift. Solo, co-op and PvP.</p>
      <p>Coming soon to the App Store and Google Play.</p>
    </div>
  </section>
  <footer>
    <a href="privacy.html">Privacy policy</a>
    <a href="mailto:mateosilvagames@gmail.com">mateosilvagames@gmail.com</a>
  </footer>
</main>
</body>
</html>
